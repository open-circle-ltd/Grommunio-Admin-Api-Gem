plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# A bang method returning true reports success; it is a command, not a query.
Naming/PredicateMethod:
  AllowBangMethods: true

# Contract and live specs describe surfaces/flows, not a single class, and
# live examples verify one end-to-end sequence per network session.
RSpec/DescribeClass:
  Exclude:
    - spec/contract/**/*
    - spec/live/**/*

# HTTP client specs assert both the outgoing request and the returned value;
# live examples verify one end-to-end sequence per network session.
RSpec/MultipleExpectations:
  Max: 4
  Exclude:
    - spec/live/**/*

RSpec/ExampleLength:
  Max: 15
  Exclude:
    - spec/live/**/*

# This gem configures behaviour through keyword arguments, which are
# self-documenting; the cop targets long positional lists.
Metrics/ParameterLists:
  CountKeywordArgs: false

# Connection carries the session lifecycle, the mutation policy, and the
# status mapping in one transport class.
Metrics/ClassLength:
  Exclude:
    - lib/grommunio_admin_api/connection.rb
