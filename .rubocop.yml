plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# Contract and live specs describe surfaces/flows, not a single class, and
# live examples verify one end-to-end sequence per network session.
RSpec/DescribeClass:
  Exclude:
    - spec/contract/**/*
    - spec/live/**/*


# HTTP client specs assert both the outgoing request and the returned value;
# live examples verify one end-to-end sequence per network session.
RSpec/MultipleExpectations:
  Max: 4
  Exclude:
    - spec/live/**/*

RSpec/ExampleLength:
  Max: 15
  Exclude:
    - spec/live/**/*

# Connection#initialize takes the documented keyword configuration set.
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/ClassLength:
  Max: 150

# Client#initialize is a keyword-configuration passthrough to Connection.
Metrics/MethodLength:
  Max: 12
