plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# Contract specs describe the API surface, not a single class.
RSpec/DescribeClass:
  Exclude:
    - spec/contract/**/*

# HTTP client specs assert both the outgoing request and the returned value.
RSpec/MultipleExpectations:
  Max: 4

RSpec/ExampleLength:
  Max: 15

# Connection#initialize takes the documented keyword configuration set.
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/ClassLength:
  Max: 150
